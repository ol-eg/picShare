---
- name: Provision server (Docker, firewall, directories)
  hosts: localhost
  connection: local
  vars:
    app_dir: /opt/picshare
    app_port: 8000
  become: yes
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-pip
          - ufw
        state: present
        update_cache: yes

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ ansible_architecture | replace("x86_64", "amd64") }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Create uploads directory
      ansible.builtin.file:
        path: "{{ app_dir }}/app/static/uploads"
        state: directory
        mode: "0755"

    - name: Open firewall port
      ansible.builtin.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp

    - name: Enable UFW (non-interactive)
      ansible.builtin.ufw:
        state: enabled
        policy: deny

- name: Deploy picShare app
  hosts: localhost
  connection: local
  vars:
    app_dir: /opt/picshare
    compose_file: "{{ app_dir }}/docker-compose.yml"
    env_file: "{{ app_dir }}/.env"
    app_port: 8000
  vars_prompt:
    - name: db_password
      prompt: "Enter Postgres password"
      private: yes
      confirm: yes
    - name: secret_key
      prompt: "Enter app secret key (generate with: python3 -c \"import secrets; print(secrets.token_urlsafe(32))\")"
      private: yes
      confirm: yes
    - name: invite_code
      prompt: "Enter invite code (leave empty for open registration)"
      private: no
      default: ""
  become: yes
  tasks:
    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Copy .env file
      ansible.builtin.copy:
        content: |
          POSTGRES_PASSWORD={{ db_password }}
          PICSHARE_DATABASE_URL=postgresql+asyncpg://picshare:{{ db_password }}@db:5432/picshare
          PICSHARE_INVITE_CODE={{ invite_code }}
          PICSHARE_SECRET_KEY={{ secret_key }}
        dest: "{{ env_file }}"
        mode: "0600"
      no_log: yes

    - name: Build and start containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always
        env_files:
          - "{{ app_dir }}/.env"

    - name: Wait for app to be healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/docs"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 15
      delay: 2