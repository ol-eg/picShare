---
- name: Provision server (Docker, firewall, directories)
  hosts: all
  vars:
    app_dir: /opt/picshare
    app_port: 80
    ssh_port: 22
  become: yes
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-pip
          - rsync
          - ufw
        state: present
        update_cache: yes

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ ansible_architecture | replace("x86_64", "amd64") }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Allow SSH through the firewall
      ansible.builtin.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Open firewall port for the app
      ansible.builtin.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp

    - name: Enable UFW (non-interactive)
      ansible.builtin.ufw:
        state: enabled
        policy: deny

- name: Deploy picShare app
  hosts: all
  vars:
    app_dir: /opt/picshare
    compose_file: "{{ app_dir }}/docker-compose.yml"
    env_file: "{{ app_dir }}/.env"
    app_port: 80
    repo_root: "{{ playbook_dir }}/.."
  become: yes
  tasks:
    - name: Check if .env already exists
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: env_stat

    - name: Read existing secrets from .env
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: env_content
      when: env_stat.stat.exists
      no_log: yes

    - name: Set defaults from existing .env
      ansible.builtin.set_fact:
        db_password: "{{ env_content.content | b64decode | regex_findall('POSTGRES_PASSWORD=(.*)') | first | default('', true) }}"
        secret_key: "{{ env_content.content | b64decode | regex_findall('PICSHARE_SECRET_KEY=(.*)') | first | default('', true) }}"
        invite_code: "{{ env_content.content | b64decode | regex_findall('PICSHARE_INVITE_CODE=(.*)') | first | default('', true) }}"
        cookie_secure: "{{ env_content.content | b64decode | regex_findall('PICSHARE_COOKIE_SECURE=(.*)') | first | default('false', true) }}"
        duckdns_token: "{{ env_content.content | b64decode | regex_findall('DUCKDNS_TOKEN=(.*)') | first | default('', true) }}"
      when: env_stat.stat.exists
      no_log: yes

    - name: Prompt for Postgres password (first deploy only)
      ansible.builtin.pause:
        prompt: "Enter Postgres password"
      register: prompt_db
      when: not env_stat.stat.exists
      no_log: yes

    - name: Prompt for secret key (first deploy only)
      ansible.builtin.pause:
        prompt: "Enter app secret key (generate with: python3 -c \"import secrets; print(secrets.token_urlsafe(32))\")"
      register: prompt_key
      when: not env_stat.stat.exists
      no_log: yes

    - name: Prompt for invite code (first deploy only)
      ansible.builtin.pause:
        prompt: "Enter invite code (leave empty for open registration)"
      register: prompt_invite
      when: not env_stat.stat.exists

    - name: Prompt for DuckDNS token (first deploy only)
      ansible.builtin.pause:
        prompt: "Enter DuckDNS token (get from duckdns.org, empty to skip)"
      register: prompt_duckdns
      when: not env_stat.stat.exists
      no_log: yes

    - name: Set secrets from prompts (first deploy only)
      ansible.builtin.set_fact:
        db_password: "{{ prompt_db.user_input }}"
        secret_key: "{{ prompt_key.user_input }}"
        invite_code: "{{ prompt_invite.user_input | default('') }}"
        cookie_secure: false
        duckdns_token: "{{ prompt_duckdns.user_input | default('') }}"
      when: not env_stat.stat.exists
      no_log: yes

    - name: Sync repo to app directory (exclude git, venvs, caches)
      ansible.builtin.synchronize:
        src: "{{ repo_root }}/"
        dest: "{{ app_dir }}"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
          - "--exclude=htmlcov"
          - "--exclude=.coverage"
          - "--exclude=*.pyc"

    - name: Copy docker-compose.yml template over the synced dev copy
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Ensure app static directories exist (git doesn't track empty dirs)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ app_dir }}/app/static/uploads"
        - "{{ app_dir }}/app/static/thumbnails"

    - name: Copy .env file
      ansible.builtin.copy:
        content: |
          POSTGRES_PASSWORD={{ db_password }}
          PICSHARE_DATABASE_URL=postgresql+asyncpg://picshare:{{ db_password }}@db:5432/picshare
          PICSHARE_INVITE_CODE={{ invite_code }}
          PICSHARE_SECRET_KEY={{ secret_key }}
          PICSHARE_COOKIE_SECURE={{ cookie_secure }}
          DUCKDNS_DOMAIN=mypish
          DUCKDNS_TOKEN={{ duckdns_token }}
        dest: "{{ env_file }}"
        mode: "0600"
      no_log: yes

    - name: Build and start containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always
        env_files:
          - "{{ app_dir }}/.env"

    - name: Wait for app to be healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/docs"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 15
      delay: 2

    - name: Install DuckDNS updater script
      ansible.builtin.copy:
        dest: /opt/picshare/duckdns.sh
        content: |
          #!/bin/sh
          . /opt/picshare/.env
          echo url="https://www.duckdns.org/update?domains=$DUCKDNS_DOMAIN&token=$DUCKDNS_TOKEN&ip=" | curl -k -o /opt/picshare/duckdns.log -s -K -
        mode: "0755"

    - name: Install DuckDNS cron job (every 5 minutes)
      ansible.builtin.cron:
        name: duckdns-update
        minute: "*/5"
        job: "/opt/picshare/duckdns.sh"
        state: present