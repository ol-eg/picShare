{% extends "base.html" %}
{% block content %}
<section class="text-center py-16">
  <h1 class="text-4xl font-bold text-gray-900">picShare</h1>
  <p class="mt-4 text-lg text-gray-600">Multi-user photo sharing</p>
  {% if user %}
  <p class="mt-4 text-gray-700">Signed in as <span class="font-semibold">{{ user.username }}</span></p>
  <form method="post" action="/logout" class="mt-8">
    <button type="submit"
            class="px-6 py-2 bg-gray-200 text-gray-800 rounded">Log out</button>
  </form>
  {% else %}
  <div class="mt-8 space-x-4">
    <a href="/login" class="inline-block px-6 py-2 bg-blue-600 text-white rounded">Log in</a>
    <a href="/register" class="inline-block px-6 py-2 bg-gray-200 text-gray-800 rounded">Register</a>
  </div>
  {% endif %}
</section>

{% if images %}
<section class="max-w-4xl mx-auto px-4 pb-16">
  <h2 class="text-2xl font-bold text-gray-900 mb-4">Gallery</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    {% for image in images %}
    <figure class="rounded overflow-hidden shadow">
      <img src="/thumbnails/{{ image.filename }}" alt="{{ image.original_name or image.filename }}"
           class="w-full h-40 object-cover">
      {% if image.caption %}
      <figcaption class="p-2 text-sm text-gray-700">{{ image.caption }}</figcaption>
      {% endif %}
    </figure>
    {% endfor %}
  </div>
</section>
{% endif %}
{% endblock %}
