{% extends "base.html" %}
{% block content %}
<section class="text-center py-16">
  <h1 class="text-4xl font-bold text-gray-900">picShare</h1>
  <p class="mt-4 text-lg text-gray-600">Multi-user photo sharing</p>
  {% if user %}
  <p class="mt-4 text-gray-700">Signed in as <span class="font-semibold">{{ user.username }}</span></p>
  <form method="post" action="/logout" class="mt-8">
    <button type="submit"
            class="px-6 py-2 bg-gray-200 text-gray-800 rounded">Log out</button>
  </form>
  {% else %}
  <div class="mt-8 space-x-4">
    <a href="/login" class="inline-block px-6 py-2 bg-blue-600 text-white rounded">Log in</a>
    <a href="/register" class="inline-block px-6 py-2 bg-gray-200 text-gray-800 rounded">Register</a>
  </div>
  {% endif %}
</section>
{% endblock %}
