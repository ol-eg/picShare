{% extends "base.html" %}
{% block content %}
<section class="max-w-md mx-auto py-16">
  <h1 class="text-4xl font-bold text-gray-900 text-center mb-8">Upload a photo</h1>
  {% if error %}
  <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-800">{{ error }}</div>
  {% endif %}
  <form method="post" action="/upload" enctype="multipart/form-data"
        class="space-y-4 bg-white p-8 rounded-lg shadow">
    <div>
      <label for="file" class="block text-sm font-medium text-gray-700">Photo</label>
      <input type="file" id="file" name="file" required accept="image/*"
             class="mt-1 w-full rounded-md border border-gray-300 p-2">
    </div>
    <div>
      <label for="caption" class="block text-sm font-medium text-gray-700">Caption</label>
      <input type="text" id="caption" name="caption"
             class="mt-1 w-full rounded-md border border-gray-300 p-2">
    </div>
    <button type="submit"
            class="w-full rounded-md bg-blue-600 py-2 font-medium text-white hover:bg-blue-700">
      Upload
    </button>
  </form>
</section>
{% endblock %}
