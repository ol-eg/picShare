services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: picshare
      POSTGRES_PASSWORD: picshare
      POSTGRES_DB: picshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: picshare
      POSTGRES_PASSWORD: picshare
      POSTGRES_DB: picshare_test
    ports:
      - "5433:5432"
    tmpfs: /var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PICSHARE_DATABASE_URL: "postgresql+asyncpg://picshare:picshare@db:5432/picshare"
    depends_on:
      - db
    volumes:
      - ./app/static:/app/app/static

volumes:
  pgdata: